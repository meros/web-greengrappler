# Main nginx config for the Cloud Run image. Runs as the unprivileged "nginx"
# user, so every path nginx writes to is under /tmp.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cloud Run already logs every request.
    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Compression. PNG, MP3 and OGG are already compressed. The official nginx
    # image has no brotli module, so gzip is all there is.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cache rules. The bundle is named game-<content hash>.js, so it can be
    # cached forever. Everything else keeps its name when it changes, so the
    # browser must revalidate (nginx sends ETag / Last-Modified, so an
    # unchanged file costs a 304, not a download).
    map $uri $cache_control {
        default                          "no-cache";
        ~^/game-[A-Za-z0-9_-]+\.js$      "public, max-age=31536000, immutable";
        ~^/assets/                       "public, max-age=3600, must-revalidate";
        /health                          "no-store";
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;

        # add_header at server level only: a location with its own add_header
        # would drop all of these.
        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Health check. Not /healthz: Cloud Run reserves paths ending in "z".
        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files /index.html =404;
        }

        # Unknown paths are a real 404, not index.html, so a missing asset
        # fails loudly instead of the game parsing HTML as an image or room.
        location / {
            try_files $uri =404;
        }
    }
}
