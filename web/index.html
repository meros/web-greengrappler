<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Grappler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #game-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #loading {
      color: #e7d79c;
      font-family: monospace;
      font-size: 20px;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="320" height="240"></canvas>
  <script>
    function resizeCanvas() {
      var c = document.getElementById('game-canvas');
      var w = window.innerWidth, h = window.innerHeight;
      var scale = Math.min(Math.floor(w / 320), Math.floor(h / 240));
      if (scale < 1) scale = Math.min(w / 320, h / 240);
      c.style.width = (320 * scale) + 'px';
      c.style.height = (240 * scale) + 'px';
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
  </script>
  <script src="game.js"></script>
</body>
</html>
